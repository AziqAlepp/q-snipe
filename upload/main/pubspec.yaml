name: queue_sniper
description: Discord queue-button sniper for Android (Gateway listener + interaction click).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2
  audioplayers: ^6.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    
