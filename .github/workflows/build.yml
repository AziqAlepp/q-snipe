          python3 - <<'QSEOF'
          import wave, struct, math
          sr = 22050
          frames = []
          for freq, dur in ((880, 0.12), (1320, 0.18)):
              n = int(sr * dur)
              for i in range(n):
                  env = min(1, i / 200) * min(1, (n - i) / 400)
                  frames.append(int(32767 * 0.5 * env * math.sin(2 * math.pi * freq * i / sr)))
          with wave.open('assets/sounds/snipe.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h', s) for s in frames))
          QSEOF

      - name: Test (non-blocking)
        working-directory: queue_sniper
        continue-on-error: true
        run: |
          flutter pub get
          flutter test

      - name: Build APK
        working-directory: queue_sniper
        run: |
          flutter pub get
          flutter build apk --release

      - name: Show build outputs
        run: find queue_sniper/build/app/outputs -name '*.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: queue-sniper-apk
          path: queue_sniper/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            queue_sniper/build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug-signed release APK"
