name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Builds whatever is committed to this repo. The 15 source files (pubspec.yaml,
# the .dart files, build.gradle.kts, AndroidManifest.xml, core_test.dart) are
# located by FILENAME anywhere in the repo (except .git and .github), so it
# does not matter which folder they ended up in after upload. Everything else
# (the rest of the Android project) is generated by `flutter create`.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate committed source files, wherever they landed
        run: |
          set -e
          mkdir -p src/lib/app src/lib/core src/lib/services
          mkdir -p src/test src/android/app/src/main
          missing=0

          find_one() {
            local name="$1" dest="$2" hit
            hit=$(find . -path ./.git -prune -o -path ./.github -prune \
                  -o -type f -name "$name" -print | head -n1)
            if [ -z "$hit" ]; then
              echo "::error::Could not find $name anywhere in the repo."
              missing=1
              return
            fi
            cp "$hit" "$dest"
            echo "Found $name -> $dest  (was at $hit)"
          }

          find_one pubspec.yaml               src/pubspec.yaml
          find_one main.dart                  src/lib/main.dart
          find_one home_page.dart             src/lib/app/home_page.dart
          find_one web_login_page.dart        src/lib/app/web_login_page.dart
          find_one models.dart                src/lib/core/models.dart
          find_one button_matcher.dart        src/lib/core/button_matcher.dart
          find_one discord_rest.dart          src/lib/core/discord_rest.dart
          find_one gateway_client.dart        src/lib/core/gateway_client.dart
          find_one sniper_engine.dart         src/lib/core/sniper_engine.dart
          find_one storage.dart               src/lib/services/storage.dart
          find_one notification_service.dart  src/lib/services/notification_service.dart
          find_one sniper_service.dart        src/lib/services/sniper_service.dart
          find_one build.gradle.kts           src/android/app/build.gradle.kts
          find_one AndroidManifest.xml        src/android/app/src/main/AndroidManifest.xml
          find_one core_test.dart             src/test/core_test.dart

          if [ "$missing" = "1" ]; then
            echo "One or more required files were not found anywhere in the"
            echo "repo (any folder). Add the missing one(s) and re-run."
            exit 1
          fi

      - name: Generate Android scaffolding and overlay the sources on it
        run: |
          set -e
          flutter create --org com.queuesniper --project-name queue_sniper \
            --platforms android queue_sniper
          rm -f queue_sniper/test/widget_test.dart queue_sniper/android/app/build.gradle
          cp src/pubspec.yaml queue_sniper/pubspec.yaml
          rm -rf queue_sniper/lib queue_sniper/test
          cp -r src/lib queue_sniper/lib
          cp -r src/test queue_sniper/test
          cp src/android/app/build.gradle.kts queue_sniper/android/app/build.gradle.kts
          cp src/android/app/src/main/AndroidManifest.xml \
             queue_sniper/android/app/src/main/AndroidManifest.xml

      - name: Generate alert sound
        working-directory: queue_sniper
        run: |
          mkdir -p assets/sounds
          python3 - <<'PY'
          import wave, struct, math
          sr = 22050
          frames = []
          for freq, dur in ((880, 0.12), (1320, 0.18)):
              n = int(sr * dur)
              for i in range(n):
                  env = min(1, i / 200) * min(1, (n - i) / 400)
                  frames.append(int(32767 * 0.5 * env * math.sin(2 * math.pi * freq * i / sr)))
          with wave.open('assets/sounds/snipe.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h', s) for s in frames))
          PY

      - name: Test (non-blocking)
        working-directory: queue_sniper
        continue-on-error: true
        run: |
          flutter pub get
          flutter test

      - name: Build APK
        working-directory: queue_sniper
        run: |
          flutter pub get
          flutter build apk --release

      - name: Show build outputs
        run: find queue_sniper/build/app/outputs -name '*.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: queue-sniper-apk
          path: queue_sniper/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            queue_sniper/build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug-signed release APK"
            
