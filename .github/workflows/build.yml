          QSEOF
          cat > lib/app/web_login_page.dart <<'QSEOF'
          import 'dart:async';

          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          import '../core/models.dart';

          /// Real discord.com login inside a WebView. Once the page reaches /channels,
          /// the token Discord keeps in its web storage is read and returned to the
          /// caller (Navigator.pop with the token). It never leaves the device.
          class WebLoginPage extends StatefulWidget {
            const WebLoginPage({super.key});

            @override
            State<WebLoginPage> createState() => _WebLoginPageState();
          }

          class _WebLoginPageState extends State<WebLoginPage> {
            // Discord removes window.localStorage, so a fresh iframe's copy is read.
            // Same idea as the reference APK's embedded script.
            static const String _js = '''
          (function(){try{var f=document.createElement('iframe');document.body.appendChild(f);var t=f.contentWindow.localStorage.getItem('token');f.remove();return t;}catch(e){return null;}})()
          ''';

            late final WebViewController _controller;
            Timer? _poll;
            bool _busy = false;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('https://discord.com/login'));
              _poll = Timer.periodic(const Duration(seconds: 2), (_) => _check());
            }

            @override
            void dispose() {
              _poll?.cancel();
              super.dispose();
            }

            Future<void> _check() async {
              if (_busy || !mounted) return;
              _busy = true;
              try {
                final url = await _controller.currentUrl();
                if (url == null || !url.contains('/channels')) return;
                final res = await _controller.runJavaScriptReturningResult(_js);
                final token = normalizeCapturedToken(res.toString());
                if (token != null && mounted) {
                  _poll?.cancel();
                  Navigator.of(context).pop(token);
                }
              } catch (_) {
                // Page not ready or script blocked: try again on the next tick.
              } finally {
                _busy = false;
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Discord login')),
                body: Column(
                  children: [
                    const Padding(
                      padding: EdgeInsets.all(12),
                      child: Text(
                        'Log in normally. The token is captured automatically once '
                        'your channel list opens.',
                        style: TextStyle(fontSize: 12),
                      ),
                    ),
                    Expanded(child: WebViewWidget(controller: _controller)),
                  ],
                ),
              );
            }
          }
          QSEOF
          cat > lib/core/models.dart <<'QSEOF'
          import 'dart:convert';

          /// Discord ids are 64-bit snowflakes, 15-21 decimal digits in practice.
          bool isSnowflake(String s) => RegExp(r'^\d{15,21}$').hasMatch(s);

          /// Cleans a token as pasted by the user or returned by the WebView script:
          /// strips (possibly nested/escaped) JSON quotes and rejects anything that
          /// can't be a token. Returns null when invalid.
          String? normalizeCapturedToken(String? raw) {
            var t = (raw ?? '').trim();
            for (var i = 0; i < 3; i++) {
              if (t.length >= 2 && t.startsWith('"') && t.endsWith('"')) {
                try {
                  final d = jsonDecode(t);
                  if (d is String) {
                    t = d.trim();
                    continue;
                  }
                } catch (_) {}
                t = t.substring(1, t.length - 1);
              } else {
                break;
              }
            }
            if (t == 'null' || t.length < 20 || RegExp(r'\s').hasMatch(t)) return null;
            return t;
          }

          /// Only real Discord webhook URLs are accepted, so a typo can't send
          /// snipe reports to an arbitrary host.
          bool isValidWebhookUrl(String url) {
            final uri = Uri.tryParse(url.trim());
            if (uri == null || uri.scheme != 'https') return false;
            const hosts = {
              'discord.com',
              'ptb.discord.com',
              'canary.discord.com',
              'discordapp.com',
            };
            return hosts.contains(uri.host) && uri.path.startsWith('/api/webhooks/');
          }

          class QueueTarget {
            const QueueTarget({
              required this.guildId,
              required this.channelId,
              this.customButtonId = '',
              this.keywords = defaultKeywords,
            });

            /// Used when no custom button id is set. Design choice of this project,
            /// editable per queue. An empty list means "first clickable button".
            static const List<String> defaultKeywords = ['join', 'queue'];

            final String guildId;
            final String channelId;

            /// Exact `custom_id` of the button to click. Empty string = not set.
            final String customButtonId;
            final List<String> keywords;

            Map<String, dynamic> toJson() => {
                  'guildId': guildId,
                  'channelId': channelId,
                  'customButtonId': customButtonId,
                  'keywords': keywords,
                };

            factory QueueTarget.fromJson(Map<String, dynamic> json) {
              final kw = json['keywords'];
              return QueueTarget(
                guildId: (json['guildId'] ?? '').toString(),
                channelId: (json['channelId'] ?? '').toString(),
                customButtonId: (json['customButtonId'] ?? '').toString(),
                keywords: kw is List
                    ? kw.map((e) => e.toString()).toList()
                    : defaultKeywords,
              );
            }
          }

          class SniperConfig {
            const SniperConfig({
              this.targets = const [],
              this.webhookUrl = '',
              this.soundEnabled = true,
              this.notifyEnabled = true,
            });

            final List<QueueTarget> targets;
            final String webhookUrl;
            final bool soundEnabled;
            final bool notifyEnabled;

            SniperConfig copyWith({
              List<QueueTarget>? targets,
              String? webhookUrl,
              bool? soundEnabled,
              bool? notifyEnabled,
            }) =>
                SniperConfig(
                  targets: targets ?? this.targets,
                  webhookUrl: webhookUrl ?? this.webhookUrl,
                  soundEnabled: soundEnabled ?? this.soundEnabled,
                  notifyEnabled: notifyEnabled ?? this.notifyEnabled,
                );

            Map<String, dynamic> toJson() => {
                  'targets': targets.map((t) => t.toJson()).toList(),
                  'webhookUrl': webhookUrl,
                  'soundEnabled': soundEnabled,
                  'notifyEnabled': notifyEnabled,
                };

            String encode() => jsonEncode(toJson());

            static SniperConfig decode(String? raw) {
              if (raw == null || raw.isEmpty) return const SniperConfig();
              try {
                final j = jsonDecode(raw);
                if (j is! Map<String, dynamic>) return const SniperConfig();
                final t = j['targets'];
                return SniperConfig(
                  targets: t is List
                      ? t
                          .whereType<Map<String, dynamic>>()
                          .map(QueueTarget.fromJson)
                          .toList()
                      : const [],
                  webhookUrl: (j['webhookUrl'] ?? '').toString(),
                  soundEnabled: j['soundEnabled'] != false,
                  notifyEnabled: j['notifyEnabled'] != false,
                );
              } catch (_) {
                return const SniperConfig();
              }
            }
          }
          QSEOF
          cat > lib/core/button_matcher.dart <<'QSEOF'
          import 'models.dart';

          /// Pure helpers (no I/O) so they can be unit-tested without Discord.

          const int discordEpochMs = 1420070400000; // 2015-01-01T00:00:00Z

          class ButtonMatch {
            const ButtonMatch({required this.customId, required this.label});
            final String customId;
            final String label;
          }

          /// Discord snowflake built from the current time; used as interaction nonce.
          /// Dart VM ints are 64-bit, so the shift cannot overflow on Android.
          String generateNonce({int? nowMs}) {
            final ms = nowMs ?? DateTime.now().millisecondsSinceEpoch;
            return ((ms - discordEpochMs) << 22).toString();
          }

          /// Walks the component tree. Handles classic action rows (type 1 ->
          /// components) and nested layouts (containers/sections with `components`
          /// or `accessory`), collecting every button (type 2).
          void _collectButtons(dynamic node, List<Map<String, dynamic>> out) {
            if (node is List) {
              for (final e in node) {
                _collectButtons(e, out);
              }
            } else if (node is Map) {
              if (node['type'] == 2) {
                out.add(Map<String, dynamic>.from(node));
              }
              _collectButtons(node['components'], out);
              _collectButtons(node['accessory'], out);
            }
          }

          const List<String> _negativeWords = ['leave', 'cancel', 'exit', 'quit'];

          /// Returns the button to click, or null.
          /// - Link buttons (style 5) and disabled buttons are never clickable.
          /// - If [target.customButtonId] is set, only an exact custom_id match counts.
          /// - Otherwise the first button whose label or custom_id contains one of
          ///   [target.keywords] (case-insensitive); with no keywords, the first
          ///   clickable button.
          ButtonMatch? findButton(dynamic components, QueueTarget target) {
            final buttons = <Map<String, dynamic>>[];
            _collectButtons(components, buttons);

            final wanted = target.customButtonId.trim();
            final keywords = target.keywords
                .map((k) => k.trim().toLowerCase())
                .where((k) => k.isNotEmpty)
                .toList();

            for (final b in buttons) {
              if (b['style'] == 5 || b['disabled'] == true) continue;
              final id = b['custom_id'];
              if (id is! String || id.isEmpty) continue;
              final label = (b['label'] ?? '').toString();

              if (wanted.isNotEmpty) {
                if (id == wanted) return ButtonMatch(customId: id, label: label);
                continue;
              }
              final hay = '${label.toLowerCase()} ${id.toLowerCase()}';
              // Keyword mode must never press "Leave queue" and friends.
              if (_negativeWords.any(hay.contains)) continue;
              if (keywords.isEmpty) return ButtonMatch(customId: id, label: label);
              if (keywords.any(hay.contains)) {
                return ButtonMatch(customId: id, label: label);
              }
            }
            return null;
          }

