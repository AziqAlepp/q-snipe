name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Builds whatever is committed to this repo: pubspec.yaml, lib/, test/ and
# android/app/{build.gradle.kts,src/main/AndroidManifest.xml}. Nothing else
# needs to be in the repo; the rest of the Android project is generated by
# `flutter create` and the committed files are copied on top of it.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required files are present
        run: |
          set -e
          missing=0
          for f in pubspec.yaml lib/main.dart android/app/build.gradle.kts \
                   android/app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f - add it to the repo first."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "See the project's README for the full file list."
            exit 1
          fi

      - name: Generate Android scaffolding and overlay the repo on it
        run: |
          set -e
          flutter create --org com.queuesniper --project-name queue_sniper \
            --platforms android queue_sniper
          rm -f queue_sniper/test/widget_test.dart queue_sniper/android/app/build.gradle
          cp pubspec.yaml queue_sniper/pubspec.yaml
          rm -rf queue_sniper/lib queue_sniper/test
          cp -r lib queue_sniper/lib
          cp -r test queue_sniper/test
          cp android/app/build.gradle.kts queue_sniper/android/app/build.gradle.kts
          cp android/app/src/main/AndroidManifest.xml \
             queue_sniper/android/app/src/main/AndroidManifest.xml

      - name: Generate alert sound
        working-directory: queue_sniper
        run: |
          mkdir -p assets/sounds
          python3 - <<'PY'
          import wave, struct, math
          sr = 22050
          frames = []
          for freq, dur in ((880, 0.12), (1320, 0.18)):
              n = int(sr * dur)
              for i in range(n):
                  env = min(1, i / 200) * min(1, (n - i) / 400)
                  frames.append(int(32767 * 0.5 * env * math.sin(2 * math.pi * freq * i / sr)))
          with wave.open('assets/sounds/snipe.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h', s) for s in frames))
          PY

      - name: Test (non-blocking)
        working-directory: queue_sniper
        continue-on-error: true
        run: |
          flutter pub get
          flutter test

      - name: Build APK
        working-directory: queue_sniper
        run: |
          flutter pub get
          flutter build apk --release

      - name: Show build outputs
        run: find queue_sniper/build/app/outputs -name '*.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: queue-sniper-apk
          path: queue_sniper/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            queue_sniper/build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug-signed release APK"
