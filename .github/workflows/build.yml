                'nonce': nonce ?? generateNonce(),
                'guild_id': guildId,
                'channel_id': channelId,
                'message_flags': messageFlags,
                'message_id': messageId,
                'application_id': applicationId,
                'session_id': sessionId,
                'data': {
                  'component_type': 2,
                  'custom_id': customId,
                },
              };
