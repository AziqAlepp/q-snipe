                isForegroundMode: true,
                notificationChannelId: kForegroundChannelId,
                initialNotificationTitle: 'Queue Sniper',
                initialNotificationContent: 'Starting...',
                foregroundServiceNotificationId: kForegroundNotificationId,
                foregroundServiceTypes: [AndroidForegroundType.specialUse],
              ),
              iosConfiguration: IosConfiguration(autoStart: false),
            );
          }

          String _stamp() {
            final n = DateTime.now();
            String two(int v) => v.toString().padLeft(2, '0');
            return '${two(n.hour)}:${two(n.minute)}:${two(n.second)}';
          }

          /// Entry point of the background isolate.
          @pragma('vm:entry-point')
          Future<void> onSniperServiceStart(ServiceInstance service) async {
            DartPluginRegistrant.ensureInitialized();

            void log(String line) => service.invoke('log', {'line': '[${_stamp()}] $line'});

            void status(String text) {
              if (service is AndroidServiceInstance) {
                service.setForegroundNotificationInfo(
                  title: 'Queue Sniper',
                  content: text,
                );
              }
            }

            final storage = Storage();
            final token = await storage.readToken();
            final config = await storage.loadConfig();
            await NotificationService.instance.init();

            if (token == null || token.isEmpty) {
              log('No token saved. Stopping.');
              service.invoke('stopped', {'reason': 'no token'});
              await service.stopSelf();
              return;
            }

            var snipes = 0;
            SniperEngine? engine;

            Future<void> shutdown(String reason) async {
              await engine?.stop();
              service.invoke('stopped', {'reason': reason});
              await service.stopSelf();
            }

            engine = SniperEngine(
              token: token,
              config: config,
              onLog: log,
              onFatal: (m) {
                log('FATAL: $m');
                unawaited(shutdown(m));
              },
              onSnipe: (r) {
                snipes++;
                status('Watching queues. Snipes: $snipes');
                service.invoke('snipe', {'label': r.label, 'latency': r.latencyMs});
                if (config.soundEnabled) {
                  unawaited(NotificationService.instance.playSnipeSound());
                }
                if (config.notifyEnabled) {
                  unawaited(NotificationService.instance.showSnipe(
                    'Queue button clicked',
                    '"${r.label}" in ${r.latencyMs} ms',
                  ));
                }
              },
            );

            service.on('stop').listen((_) {
              unawaited(shutdown('stopped by user'));
            });

            status('Connecting...');
            await engine.start();
            if (engine.running) status('Watching queues. Snipes: 0');
          }
          QSEOF
