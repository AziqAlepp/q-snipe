          import wave, struct, math
          sr = 22050
          frames = []
          for freq, dur in ((880, 0.12), (1320, 0.18)):
              n = int(sr * dur)
              for i in range(n):
                  env = min(1, i / 200) * min(1, (n - i) / 400)
                  frames.append(int(32767 * 0.5 * env * math.sin(2 * math.pi * freq * i / sr)))
          with wave.open('assets/sounds/snipe.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h', s) for s in frames))
